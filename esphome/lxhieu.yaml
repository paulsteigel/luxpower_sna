# lxhieu.yaml — Sprinkler controller — ESP8266-01S + on-board UART relay board
# (LC Technology, STC15L101EW-driven)
#
# HARDWARE NOTE
# This relay board's 4 relays are not wired to ESP8266 GPIOs. An onboard
# STC15L101EW MCU drives the relays, and the ESP talks to it over its ONE
# hardware UART using 4-byte commands:
#
#     [0xA0, relay_no, state, checksum]        state: 0x01=on, 0x00=off
#     checksum = (0xA0 + relay_no + state) & 0xFF
#
# Baud rate: 115200 (confirmed working on real hardware).
#
# Because the ESP-01S only breaks out GPIO0, GPIO2, GPIO1(TX0) and GPIO3(RX0),
# the hardware UART (TX0/RX0) is fully dedicated to this relay link — so
# console logging over UART is turned off below (logger: baud_rate: 0). Logs
# flow wirelessly via `api:` instead — connect with the ESPHome dashboard or
# Home Assistant to view them.
#
# RELAY MAPPING
#   Relay 1 = Valve 1 (irrigation zone 1)
#   Relay 2 = Valve 2 (irrigation zone 2)
#   Relay 3 = Pump   — turned on ~3s after a valve opens (once it's done
#             settling) and turned off FIRST, before the valve closes, so the
#             pump never runs against a closed valve. Avoids water hammer.
#   Relay 4 = Extension relay, wired here as a plain manual light switch,
#             completely independent of the irrigation logic.
#
# WHY THIS ISN'T USING THE `sprinkler:` COMPONENT
# The repo's custom `sprinkler:` component (components/sprinkler) reliably
# turns valves ON, but valve 1/2 would get stuck open on shutdown. Irrigation
# sequencing is instead implemented directly in ESPHome YAML below.
#
# INTERLOCK DESIGN (v3 — non-blocking state machine, not blocking scripts)
# The first two YAML-only attempts used `script:` blocks with `delay:` steps
# and `mode: restart` to re-sequence a zone change. That's fundamentally the
# wrong tool: a blocking script mid-delay has no way to notice the user
# changed their mind, so a second button press had to kill-and-restart the
# whole close/open sequence, which re-toggled relays that were already
# correctly positioned (valve flickers on/off, needs 2-3 presses to "stick").
#
# The fix is a small poll-driven state machine (see the FSM `interval:`
# below), not scripts. Two globals describe all irrigation state:
#   requested_zone -- what the user/schedule currently wants (-1/0/1),
#                     updated instantly, any number of times, at any moment.
#   fsm_state      -- what's physically happening right now: IDLE(0),
#                     STOPPING_PUMP(1), CLOSING_VALVE(2), OPENING_VALVE(3),
#                     RUNNING(4), OVERLAP_CLOSING(5).
# Every ~1s the FSM compares requested_zone against what it's currently
# running/transitioning towards and decides the ONE next relay command (if
# any), spaced out by the same real settle delays as before (5s pump,
# 10s valve, 3s pre-pump) — timed with millis(), never a blocking `delay:`.
# This 1s tick stays constant even when idle: the check itself is a couple
# int comparisons (free next to the ESP8266's WiFi/MQTT work), and slowing it
# down while idle would add its own multi-second lag to the very first
# reaction after a button press -- the opposite of what this file is for.
# Flipping requested_zone back and forth rapidly just changes an int
# repeatedly; the FSM only ever acts on its CURRENT value when a timer
# elapses, so no amount of impatient re-pressing can make it re-toggle a
# relay that's already where it needs to be.
#
# ZONE ON/OFF: "Zone 1"/"Zone 2" switches below just set requested_zone.
# "Run All Zones Now" (or a schedule) starts a cycle: zone 1, then if "Auto
# Advance" is on and zone 2 is enabled, zone 2 right after.
#
# MODES
#   Auto Mode ON  -> schedules run automatically (days + up to 3 start times)
#   Auto Mode OFF -> Manual: schedules are ignored, control zones by hand
#
# First boot default = Manual (Auto Mode OFF), so nothing waters until you
# turn Auto on.

substitutions:
  name: lxhieu
  token: d9103e90992f10581e245378
  port: 8266

esphome:
  name: ${name}
  friendly_name: Sprinkler Controller
  # The 3 irrigation relays are driven by the relay board's OWN separate MCU
  # (see HARDWARE NOTE up top), which keeps its own relay state independent
  # of the ESP -- an ESP reboot (crash, OTA, watchdog, power blip on just the
  # ESP) does NOT reset the relay board, so a valve/pump left on before the
  # reboot could stay on indefinitely while our globals here re-init to
  # "idle" and never think to turn anything off. Force all 3 off on every
  # boot so we always start from a known-safe physical state, regardless of
  # what they were doing before. Real gaps between frames, same as everywhere
  # else in this file -- blocking `delay:` is fine here, it's a one-shot boot
  # sequence, not the ongoing control loop.
  on_boot:
    then:
      - script.execute: {id: send_relay, relay: 1, turn_on: false}
      - delay: 1s
      - script.execute: {id: send_relay, relay: 2, turn_on: false}
      - delay: 1s
      - script.execute: {id: send_relay, relay: 3, turn_on: false}

esp8266:
  board: esp01_1m

wifi:
  ssid: HOME
  password: ngoc12345
  ap:
    ssid: "${name}_control_board"
    password: ""

# Physical serial logging disabled: TX0/RX0 are dedicated to the relay
# board's UART link. `mqtt:` below already publishes logs to a topic by
# default (no separate `api:` needed -- that component is too heavy for
# OTA to fit on this board's 1MB flash).
logger:
  baud_rate: 0

mqtt:
  broker: myhome.sfdp.net
  username: mqtt_user
  password: D1ndh1sk@
  client_id: ${name}_mqtt

# Use the blue LED in the device as a status LED, which will blink if there are warnings (slow) or errors (fast)
status_led:
  pin:
    number: GPIO5
    inverted: True

captive_portal:

packages:
  remote_packages:
    url: https://github.com/paulsteigel/luxpower_sna
    ref: main
    refresh: 0s
    files:
      - esphome/common/dyndns.yaml
      - esphome/common/ota_http.yaml
      - esphome/common/dev_info.yaml

# UART bus to the relay board's onboard MCU (TX0/RX0 = the only UART on ESP-01S)
uart:
  id: relay_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200

interval:
  # Poll the schedule every 15s (the script itself makes sure a schedule fires only once per minute)
  - interval: 15s
    then:
      - script.execute: check_schedule

  # Adaptive status refresh:
  #   - something's running/transitioning -> refresh status text sensors every 1s
  #   - idle                              -> refresh every 10s (only needed to re-sync after MQTT
  #                                          reconnect; no point spamming MQTT while nothing changes)
  - interval: 1s
    then:
      - lambda: |-
          bool active = id(fsm_state) != 0;
          id(status_tick)++;
          if (active || active != id(was_active) || id(status_tick) >= 10) {
            id(status_tick) = 0;
            id(was_active) = active;
            id(active_zone_text).update();
            id(time_remaining).update();
            id(progress_percent).update();
          }

  # --- Irrigation state machine tick. See the INTERLOCK DESIGN comment up top. ---
  # States: IDLE=0, STOPPING_PUMP=1, CLOSING_VALVE=2, OPENING_VALVE=3, RUNNING=4,
  # OVERLAP_CLOSING=5.
  #
  # Starting from Idle, or stopping all the way to Idle, still does the slow
  # careful sequence (pump off -> settle -> valve off / valve on -> settle ->
  # pump on) since the pump is genuinely stopped/started there. But a LIVE
  # zone-to-zone handoff (pump already running, switching to a different
  # zone) never touches the pump at all: it opens the new valve first, keeps
  # both valves briefly open (this is what actually avoids water hammer --
  # hammer comes from the pump pushing into a fully-closed system, not from
  # 2 valves being open at once), then closes the old one. No pump
  # stop/restart cycling, and no 10s dead time. See OVERLAP_CLOSING (case 5).
  #
  # Never issues more than one relay/pump command per tick, so consecutive UART
  # frames are always at least 1s apart (the board can't handle back-to-back
  # frames with no gap). Stays 1s always -- see comment up top for why idle
  # doesn't get a slower interval here.
  - interval: 1s
    then:
      - lambda: |-
          uint32_t now = millis();
          int rz = id(requested_zone);
          int az = id(active_zone);

          switch (id(fsm_state)) {
            case 0: // IDLE
              if (rz >= 0) {
                id(active_zone) = rz;
                id(send_relay).execute(rz == 0 ? 1 : 2, true);
                id(fsm_phase_start_ms) = now;
                id(fsm_state) = 3;
                ESP_LOGI("sprinkler_fsm", "IDLE -> OPENING_VALVE zone=%d", rz);
              }
              break;

            case 1: // STOPPING_PUMP: pump-off sent, but the pump/pipe still has momentum for a
                    // moment after losing power -- closing the valve too soon after cutting the
                    // pump risks hammer just as much as closing it while the pump is still driven.
                    // Wait a real 5s for flow to actually settle before closing the valve.
              if (now - id(fsm_phase_start_ms) >= 5000) {
                if (az == 0) id(send_relay).execute(1, false);
                else if (az == 1) id(send_relay).execute(2, false);
                id(active_zone) = -1;
                id(fsm_phase_start_ms) = now;
                id(fsm_state) = 2;
                ESP_LOGI("sprinkler_fsm", "STOPPING_PUMP -> CLOSING_VALVE (was zone=%d)", az);
              }
              break;

            case 2: // CLOSING_VALVE: valve-off sent, wait settle then open whatever's requested (if anything)
              if (now - id(fsm_phase_start_ms) >= 10000) {
                if (rz >= 0) {
                  id(active_zone) = rz;
                  id(send_relay).execute(rz == 0 ? 1 : 2, true);
                  id(fsm_phase_start_ms) = now;
                  id(fsm_state) = 3;
                  ESP_LOGI("sprinkler_fsm", "CLOSING_VALVE -> OPENING_VALVE zone=%d", rz);
                } else {
                  id(fsm_state) = 0;
                  ESP_LOGI("sprinkler_fsm", "CLOSING_VALVE -> IDLE");
                }
              }
              break;

            case 3: // OPENING_VALVE: valve-on sent for active_zone, wait settle
              if (now - id(fsm_phase_start_ms) >= 3000) {
                if (rz == az) {
                  id(send_relay).execute(3, true);
                  int dur = (az == 0) ? (int) id(zone1_runtime).state : (int) id(zone2_runtime).state;
                  id(run_duration_s) = dur;
                  id(run_end_ms) = now + (uint32_t) dur * 1000;
                  id(fsm_phase_start_ms) = now;
                  id(fsm_state) = 4;
                  ESP_LOGI("sprinkler_fsm", "OPENING_VALVE -> RUNNING zone=%d duration=%ds", az, dur);
                } else {
                  // user changed their mind before the pump ever started -- pump
                  // was never on, so just close what we just opened, no 500ms wait needed
                  if (az == 0) id(send_relay).execute(1, false); else if (az == 1) id(send_relay).execute(2, false);
                  id(active_zone) = -1;
                  id(fsm_phase_start_ms) = now;
                  id(fsm_state) = 2;
                  ESP_LOGI("sprinkler_fsm", "OPENING_VALVE -> CLOSING_VALVE (retarget, was zone=%d)", az);
                }
              }
              break;

            case 4: { // RUNNING
              bool must_transition = (rz != az);
              if (!must_transition && (int32_t) (now - id(run_end_ms)) >= 0) {
                if (id(cycle_mode) && az == 0 && id(auto_advance).state && id(enable_zone2).state) {
                  id(requested_zone) = 1;
                } else {
                  id(requested_zone) = -1;
                  id(cycle_mode) = false;
                }
                rz = id(requested_zone);
                must_transition = true;
              }
              if (must_transition && rz < 0) {
                // genuine stop -- pump really does need to go off here
                id(send_relay).execute(3, false);
                id(fsm_phase_start_ms) = now;
                id(fsm_state) = 1;
                ESP_LOGI("sprinkler_fsm", "RUNNING -> STOPPING_PUMP (zone=%d -> idle)", az);
              } else if (must_transition) {
                // live handoff to a different zone: pump keeps running the whole time --
                // hammer comes from the pump pushing into a fully-closed system, not from
                // 2 valves being open at once, so open the new valve first and only close
                // the old one after a short overlap (see OVERLAP_CLOSING below). This also
                // avoids cycling the pump on/off for every zone change.
                id(handoff_old_zone) = az;
                id(active_zone) = rz;
                id(send_relay).execute(rz == 0 ? 1 : 2, true);
                int dur = (rz == 0) ? (int) id(zone1_runtime).state : (int) id(zone2_runtime).state;
                id(run_duration_s) = dur;
                id(run_end_ms) = now + (uint32_t) dur * 1000;
                id(fsm_phase_start_ms) = now;
                id(fsm_state) = 5;
                ESP_LOGI("sprinkler_fsm", "RUNNING -> OVERLAP_CLOSING zone=%d -> %d, pump stays on", az, rz);
              }
              break;
            }

            case 5: { // OVERLAP_CLOSING: new valve open + pump still on; close the old valve
                      // once the overlap window elapses. Longer overlap for the scheduled
                      // auto-advance (no one's waiting on it), short/snappy for a manual switch.
              uint32_t overlap_ms = id(cycle_mode) ? 3000 : 1000;
              if (now - id(fsm_phase_start_ms) >= overlap_ms) {
                int old_zone = id(handoff_old_zone);
                if (old_zone == 0) id(send_relay).execute(1, false);
                else if (old_zone == 1) id(send_relay).execute(2, false);
                id(fsm_state) = 4;
                ESP_LOGI("sprinkler_fsm", "OVERLAP_CLOSING -> RUNNING (closed old zone=%d)", old_zone);
              }
              break;
            }
          }

globals:
  - id: last_trigger_key
    type: int
    initial_value: '-1'
  - id: status_tick
    type: int
    initial_value: '0'
  - id: was_active
    type: bool
    initial_value: 'true'   # true => the very first tick publishes the initial state right away
  - id: active_zone
    type: int
    initial_value: '-1'      # -1 = idle, 0/1 = the zone whose valve is physically open right now
  - id: requested_zone
    type: int
    initial_value: '-1'      # -1 = nothing wanted, 0/1 = zone the user/schedule currently wants running
  - id: cycle_mode
    type: bool
    initial_value: 'false'   # true while running an auto "all zones" sequence (see start_cycle)
  - id: fsm_state
    type: int
    initial_value: '0'       # IDLE=0, STOPPING_PUMP=1, CLOSING_VALVE=2, OPENING_VALVE=3, RUNNING=4, OVERLAP_CLOSING=5
  - id: handoff_old_zone
    type: int
    initial_value: '-1'      # zone whose valve OVERLAP_CLOSING still needs to close
  - id: fsm_phase_start_ms
    type: uint32_t
    initial_value: '0'
  - id: run_end_ms
    type: uint32_t
    initial_value: '0'
  - id: run_duration_s
    type: uint32_t
    initial_value: '0'

# ---------------------------------------------------------------------------
# Irrigation control -- these just set globals; the FSM `interval:` above is
# what actually drives relays. See the INTERLOCK DESIGN comment up top.
# ---------------------------------------------------------------------------
script:
  # Sends one raw UART frame straight to the relay board's MCU -- no `switch:`
  # entity in between. relay: 1=valve1, 2=valve2, 3=pump (see RELAY MAPPING up
  # top). Frame format: [0xA0, relay, state, checksum], checksum computed here
  # so it's never hand-typed/hardcoded per call site.
  - id: send_relay
    mode: single
    parameters:
      relay: int
      turn_on: bool
    then:
      - uart.write:
          id: relay_uart
          data: !lambda |-
            uint8_t state = turn_on ? 1 : 0;
            uint8_t checksum = (0xA0 + relay + state) & 0xFF;
            return {(uint8_t) 0xA0, (uint8_t) relay, state, checksum};

  # Starts the "run every enabled zone" sequence: zone 1, then (if Auto
  # Advance is on and zone 2 is enabled) zone 2. The FSM's RUNNING case
  # advances cycle_mode from zone 0 to zone 1 on its own once zone 1's
  # duration elapses -- this just picks the correct starting zone.
  - id: start_cycle
    mode: single
    then:
      - lambda: |-
          id(cycle_mode) = true;
          if (id(enable_zone1).state) {
            id(requested_zone) = 0;
          } else if (id(auto_advance).state && id(enable_zone2).state) {
            id(requested_zone) = 1;
          } else {
            id(cycle_mode) = false;
            id(requested_zone) = -1;
          }

  # Immediately requests idle. The FSM tears down whatever's physically open
  # (from any state -- running, mid-open, mid-close) on its own; this never
  # touches a relay directly, so it can't race with the FSM.
  - id: stop_watering
    mode: single
    then:
      - lambda: |-
          id(cycle_mode) = false;
          id(requested_zone) = -1;

  # Runs every 15s (see interval:). Starts a full cycle when:
  #   Auto Mode is ON, no rain delay, today is enabled, and the current HH:MM
  #   matches an enabled schedule. Skipped if a cycle is already running.
  - id: check_schedule
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              auto now = id(my_time).now();
              if (!now.is_valid()) return false;
              if (!id(auto_mode).state) return false;
              if (id(rain_delay_24h).state || id(rain_delay_48h).state) return false;
              if (id(fsm_state) != 0) return false;

              // ESPHome day_of_week: 1 = Sunday ... 7 = Saturday
              bool day_ok = false;
              switch (now.day_of_week) {
                case 1: day_ok = id(day_sun).state; break;
                case 2: day_ok = id(day_mon).state; break;
                case 3: day_ok = id(day_tue).state; break;
                case 4: day_ok = id(day_wed).state; break;
                case 5: day_ok = id(day_thu).state; break;
                case 6: day_ok = id(day_fri).state; break;
                case 7: day_ok = id(day_sat).state; break;
              }
              if (!day_ok) return false;

              auto matches = [&](const std::string &hhmm) -> bool {
                int h = -1, m = -1;
                if (sscanf(hhmm.c_str(), "%d:%d", &h, &m) != 2) return false;
                return h == now.hour && m == now.minute;
              };

              bool due = (id(schedule1_enabled).state && matches(id(s1_time).state)) ||
                         (id(schedule2_enabled).state && matches(id(s2_time).state)) ||
                         (id(schedule3_enabled).state && matches(id(s3_time).state));
              if (!due) return false;

              // Fire only once per minute (the script is polled every 15s)
              int key = now.day_of_year * 1440 + now.hour * 60 + now.minute;
              if (key == id(last_trigger_key)) return false;
              id(last_trigger_key) = key;
              return true;
          then:
            - logger.log: "Schedule due - starting full cycle"
            - script.execute: start_cycle

  - id: rain_delay_24h_timer
    mode: restart
    then:
      - delay: 24h
      - switch.turn_off: rain_delay_24h

  - id: rain_delay_48h_timer
    mode: restart
    then:
      - delay: 48h
      - switch.turn_off: rain_delay_48h

# ---------------------------------------------------------------------------
# Numbers: per-zone run duration
# ---------------------------------------------------------------------------
number:
  - platform: template
    id: zone1_runtime
    name: ${name}_"Zone 1 Runtime"
    icon: "mdi:timer"
    unit_of_measurement: s
    min_value: 10
    max_value: 900
    step: 10
    initial_value: 300
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: zone2_runtime
    name: ${name}_"Zone 2 Runtime"
    icon: "mdi:timer"
    unit_of_measurement: s
    min_value: 10
    max_value: 900
    step: 10
    initial_value: 300
    restore_value: true
    optimistic: true
    entity_category: config

# ---------------------------------------------------------------------------
# Switches
# ---------------------------------------------------------------------------
switch:
  # Valve 1/2 and the pump are no longer `switch:` entities -- the FSM
  # `interval:` above sends their UART frames directly via the `send_relay`
  # script (relay 1/2/3). Only the unrelated extension relay stays a switch.
  - platform: template
    name: ${name}_"Extension Light"
    id: relay4
    turn_on_action:
      - uart.write: [0xA0, 0x04, 0x01, 0xA5]
    turn_off_action:
      - uart.write: [0xA0, 0x04, 0x00, 0xA4]
    optimistic: true

  # --- Zone controls: just tell the FSM (see interval: above) what's wanted.
  # The switch position reflects the user's INTENT (requested_zone), not
  # whether the valve has physically caught up yet -- so it flips instantly
  # and doesn't invite repeat presses while the FSM is still settling.
  - platform: template
    id: zone1_switch
    name: ${name}_"Zone 1"
    icon: "mdi:sprinkler-variant"
    lambda: |-
      return id(requested_zone) == 0;
    turn_on_action:
      - lambda: |-
          id(cycle_mode) = false;
          id(requested_zone) = 0;
    turn_off_action:
      - script.execute: stop_watering

  - platform: template
    id: zone2_switch
    name: ${name}_"Zone 2"
    icon: "mdi:sprinkler-variant"
    lambda: |-
      return id(requested_zone) == 1;
    turn_on_action:
      - lambda: |-
          id(cycle_mode) = false;
          id(requested_zone) = 1;
    turn_off_action:
      - script.execute: stop_watering

  - platform: template
    id: enable_zone1
    name: ${name}_"Enable Zone 1"
    icon: "mdi:sprinkler-variant"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: enable_zone2
    name: ${name}_"Enable Zone 2"
    icon: "mdi:sprinkler-variant"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # --- Master switch: ON = run the full cycle, OFF = stop everything ---
  - platform: template
    id: master_switch
    name: ${name}_"Sprinkler Master"
    lambda: |-
      return id(requested_zone) >= 0;
    turn_on_action:
      - script.execute: start_cycle
    turn_off_action:
      - script.execute: stop_watering

  # --- Must be ON for a full cycle to move on from Zone 1 -> Zone 2. ---
  #     If OFF, the controller stops after zone 1 finishes.
  - platform: template
    id: auto_advance
    name: ${name}_"Auto Advance"
    icon: "mdi:skip-next"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # --- Mode: ON = Auto (schedules run), OFF = Manual ---
  # Changing mode stops anything currently running, to start from a clean state.
  - platform: template
    id: auto_mode
    name: ${name}_"Auto Mode"
    icon: "mdi:calendar-clock"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: stop_watering
    on_turn_off:
      - script.execute: stop_watering

  # --- Day-of-week toggles ---
  - platform: template
    id: day_sun
    name: ${name}_Sunday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: day_mon
    name: ${name}_Monday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: day_tue
    name: ${name}_Tuesday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: day_wed
    name: ${name}_Wednesday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: day_thu
    name: ${name}_Thursday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: day_fri
    name: ${name}_Friday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: day_sat
    name: ${name}_Saturday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  # --- Enable/disable each of the 3 start times ---
  - platform: template
    id: schedule1_enabled
    name: ${name}_Enable Schedule 1
    icon: "mdi:clock-outline"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: schedule2_enabled
    name: ${name}_Enable Schedule 2
    icon: "mdi:clock-outline"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: schedule3_enabled
    name: ${name}_Enable Schedule 3
    icon: "mdi:clock-outline"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  # --- Rain delay (auto-resets; turning it off manually cancels the timer) ---
  # Always starts OFF after a reboot, so a delay can never get stuck ON.
  - platform: template
    id: rain_delay_24h
    name: ${name}_Rain Delay 24h
    icon: "mdi:weather-cloudy-clock"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: rain_delay_24h_timer
    turn_off_action:
      - script.stop: rain_delay_24h_timer
  - platform: template
    id: rain_delay_48h
    name: ${name}_Rain Delay 48h
    icon: "mdi:weather-cloudy-clock"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: rain_delay_48h_timer
    turn_off_action:
      - script.stop: rain_delay_48h_timer

# ---------------------------------------------------------------------------
# Schedule start times, entered as "HH:MM" (24h)
# (Home Assistant has no MQTT "time" entity, so a validated text field is used.)
# ---------------------------------------------------------------------------
text:
  - platform: template
    id: s1_time
    name: ${name}_"Schedule 1 Start Time"
    icon: "mdi:clock-start"
    mode: text
    min_length: 5
    max_length: 5
    pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "06:00"
  - platform: template
    id: s2_time
    name: ${name}_"Schedule 2 Start Time"
    icon: "mdi:clock-start"
    mode: text
    min_length: 5
    max_length: 5
    pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "12:00"
  - platform: template
    id: s3_time
    name: ${name}_"Schedule 3 Start Time"
    icon: "mdi:clock-start"
    mode: text
    min_length: 5
    max_length: 5
    pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "17:00"

# ---------------------------------------------------------------------------
# Status text sensors
# update_interval: never -> refreshed by the adaptive 1s interval above
# ---------------------------------------------------------------------------
text_sensor:
  - platform: template
    id: active_zone_text
    name: ${name}_"Active Zone"
    icon: "mdi:sprinkler-variant"
    update_interval: never
    # Every transitional state shows a live countdown to its next action --
    # so a several-second wait reads as "counting down to X", not "stuck".
    lambda: |-
      int rz = id(requested_zone);
      const char *target = (rz == 0) ? "Zone 1" : (rz == 1) ? "Zone 2" : "Idle";
      uint32_t elapsed = millis() - id(fsm_phase_start_ms);
      char buf[48];
      switch (id(fsm_state)) {
        case 1: {
          uint32_t left = elapsed < 5000 ? (5000 - elapsed) / 1000 + 1 : 0;
          snprintf(buf, sizeof(buf), "Stopping pump, %ds to %s...", (int) left, target);
          return std::string(buf);
        }
        case 2: {
          uint32_t left = elapsed < 10000 ? (10000 - elapsed) / 1000 + 1 : 0;
          snprintf(buf, sizeof(buf), "Valve settling, %ds to %s...", (int) left, target);
          return std::string(buf);
        }
        case 3: {
          uint32_t left = elapsed < 3000 ? (3000 - elapsed) / 1000 + 1 : 0;
          snprintf(buf, sizeof(buf), "Opening %s, %ds to pump on...", target, (int) left);
          return std::string(buf);
        }
        case 5: {
          uint32_t total = id(cycle_mode) ? 3000 : 1000;
          uint32_t left = elapsed < total ? (total - elapsed) / 1000 + 1 : 0;
          snprintf(buf, sizeof(buf), "%s running, closing old valve in %ds...", target, (int) left);
          return std::string(buf);
        }
        case 4: return std::string(target);
        default: return std::string("Idle");
      }

  - platform: template
    id: time_remaining
    name: ${name}_"Time Remaining"
    icon: "mdi:timer-sand"
    update_interval: never
    lambda: |-
      if (id(fsm_state) != 4 && id(fsm_state) != 5) return std::string("0s");
      int32_t remaining_ms = (int32_t) (id(run_end_ms) - millis());
      uint32_t remaining = remaining_ms > 0 ? (uint32_t) remaining_ms / 1000 : 0;
      char buf[24];
      snprintf(buf, sizeof(buf), "%dm %02ds", (int) (remaining / 60), (int) (remaining % 60));
      return std::string(buf);

  - platform: template
    id: progress_percent
    name: ${name}_"Progress %"
    icon: "mdi:progress-clock"
    update_interval: never
    lambda: |-
      if ((id(fsm_state) != 4 && id(fsm_state) != 5) || id(run_duration_s) == 0) return std::string("0%");
      uint32_t elapsed = (millis() - id(fsm_phase_start_ms)) / 1000;
      uint32_t pct = elapsed * 100 / id(run_duration_s);
      if (pct > 100) pct = 100;
      return std::to_string(pct) + "%";

# ---------------------------------------------------------------------------
# Buttons (work in both modes)
# ---------------------------------------------------------------------------
button:
  - platform: template
    name: ${name}_"Run All Zones Now"
    icon: "mdi:play-circle"
    on_press:
      - script.execute: start_cycle
  - platform: template
    name: ${name}_"Stop All"
    icon: "mdi:stop-circle"
    on_press:
      - script.execute: stop_watering
