# ---------------------------------------------------------------------------
# Switches
# ---------------------------------------------------------------------------
switch:
  # --- Physical relays (internal: only the FSM drives them via send_relay) ---
  - platform: gpio
    pin: GPIO15 #or GPIO15 to avoid brief power-on at boot
    name: ${name}_Relay1
    id: relay1
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO14
    name: ${name}_Relay2
    id: relay2
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO12
    name: ${name}_Relay3
    id: relay3
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO13
    name: ${name}_Relay4 Pump
    id: pump_relay
    internal: true
    restore_mode: ALWAYS_OFF

  # --- Zone controls: just tell the FSM what is wanted.
  # The switch position reflects the user's INTENT (requested_zone), not
  # whether the valve has physically caught up yet - so it flips instantly
  # and doesn't invite repeat presses while the FSM is still settling.
  - platform: template
    id: zone1_switch
    name: ${name}_"Zone 1"
    icon: "mdi:sprinkler-variant"
    lambda: |-
      return id(requested_zone) == 0;
    turn_on_action:
      - lambda: |-
          id(cycle_mode) = false;
          id(requested_zone) = 0;
    turn_off_action:
      - script.execute: stop_watering

  - platform: template
    id: zone2_switch
    name: ${name}_"Zone 2"
    icon: "mdi:sprinkler-variant"
    lambda: |-
      return id(requested_zone) == 1;
    turn_on_action:
      - lambda: |-
          id(cycle_mode) = false;
          id(requested_zone) = 1;
    turn_off_action:
      - script.execute: stop_watering

  - platform: template
    id: zone3_switch
    name: ${name}_"Zone 3"
    icon: "mdi:sprinkler-variant"
    lambda: |-
      return id(requested_zone) == 2;
    turn_on_action:
      - lambda: |-
          id(cycle_mode) = false;
          id(requested_zone) = 2;
    turn_off_action:
      - script.execute: stop_watering

  - platform: template
    id: enable_zone1
    name: ${name}_"Enable Zone 1"
    icon: "mdi:sprinkler-variant"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: enable_zone2
    name: ${name}_"Enable Zone 2"
    icon: "mdi:sprinkler-variant"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: enable_zone3
    name: ${name}_"Enable Zone 3"
    icon: "mdi:sprinkler-variant"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # --- Master switch: ON = run the full cycle, OFF = stop everything ---
  - platform: template
    id: master_switch
    name: ${name}_"Sprinkler Master"
    lambda: |-
      return id(requested_zone) >= 0;
    turn_on_action:
      - script.execute: start_cycle
    turn_off_action:
      - script.execute: stop_watering

  # --- Must be ON for a full cycle to move on from one zone to the next. ---
  #     If OFF, the controller stops after the first zone finishes.
  - platform: template
    id: auto_advance
    name: ${name}_"Auto Advance"
    icon: "mdi:skip-next"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # --- Mode: ON = Auto (schedules run), OFF = Manual ---
  # Changing mode stops anything currently running, to start from a clean state.
  - platform: template
    id: auto_mode
    name: ${name}_"Auto Mode"
    icon: "mdi:calendar-clock"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: stop_watering
    on_turn_off:
      - script.execute: stop_watering

  # --- Day-of-week toggles ---
  - platform: template
    id: day_sun
    name: ${name}_Sunday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: day_mon
    name: ${name}_Monday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: day_tue
    name: ${name}_Tuesday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: day_wed
    name: ${name}_Wednesday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: day_thu
    name: ${name}_Thursday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: day_fri
    name: ${name}_Friday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: day_sat
    name: ${name}_Saturday
    icon: "mdi:calendar-range"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  # --- Enable/disable each of the 3 start times ---
  - platform: template
    id: schedule1_enabled
    name: ${name}_Enable Schedule 1
    icon: "mdi:clock-outline"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: schedule2_enabled
    name: ${name}_Enable Schedule 2
    icon: "mdi:clock-outline"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    id: schedule3_enabled
    name: ${name}_Enable Schedule 3
    icon: "mdi:clock-outline"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  # --- Rain delay (auto-resets; turning it off manually cancels the timer) ---
  # Always starts OFF after a reboot, so a delay can never get stuck ON.
  - platform: template
    id: rain_delay_24h
    name: ${name}_Rain Delay 24h
    icon: "mdi:weather-cloudy-clock"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: rain_delay_24h_timer
    turn_off_action:
      - script.stop: rain_delay_24h_timer
  - platform: template
    id: rain_delay_48h
    name: ${name}_Rain Delay 48h
    icon: "mdi:weather-cloudy-clock"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: rain_delay_48h_timer
    turn_off_action:
      - script.stop: rain_delay_48h_timer

