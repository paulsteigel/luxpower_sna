# ---------------------------------------------------------------------------
# Weather values received over RS485 (published by the interval: lambda above)
# ---------------------------------------------------------------------------
sensor:
  - platform: template
    id: weather_temp
    name: ${name}_"Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
  - platform: template
    id: weather_hum
    name: ${name}_"Humidity"
    unit_of_measurement: "%"
    device_class: humidity
    accuracy_decimals: 1
  # Link quality counters since boot (read them the next morning to judge a soak test).
  - platform: template
    id: rs485_ok_count
    name: ${name}_"RS485 OK Lines"
    icon: "mdi:check-network"
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: 'return id(rs_ok);'   # also published every 30s so a reboot never leaves a stale retained value
    update_interval: 30s
  - platform: template
    id: rs485_bad_count
    name: ${name}_"RS485 Bad Lines"
    icon: "mdi:alert-network"
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: 'return id(rs_bad);'
    update_interval: 30s

# Change the RS485 speed live from HA (to find where the long cable stops working).
# Negotiated with the slave: ESP sends "B=19200", slave answers "OK B=19200" at the old
# speed, both switch, ESP verifies with a real reading and falls back if that fails.
# Not persisted: always boots at the uart: baud_rate above (9600).
select:
  - platform: template
    id: rs485_baud
    name: ${name}_"RS485 Baud"
    icon: "mdi:speedometer"
    entity_category: config
    optimistic: true
    options: ["1200", "2400", "4800", "9600", "19200", "38400", "57600", "115200"]
    initial_option: "9600"
    set_action:
      - lambda: |-
          int nb = atoi(x.c_str());
          if (id(baud_state) != 0 || nb == id(baud_cur)) {
            id(baud_fix) = true;  // busy or no change: snap the select back to the real speed
            return;
          }
          id(baud_new) = nb;
          id(baud_tries) = 1;
          id(baud_state) = 1;
          id(baud_t) = millis();
          id(rs485_uart).write_str(("B=" + std::to_string(nb) + "\n").c_str());
          ESP_LOGI("rs485", "asking slave to switch to %d", nb);

binary_sensor:
  - platform: template
    id: weather_rain
    name: ${name}_"Rain"
    device_class: moisture

