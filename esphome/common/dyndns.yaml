# ============================================================
# dyndns.yaml — DynDNS + SNTP (watchdog-safe)
# ============================================================

http_request:
  id: http_data
  verify_ssl: false
  timeout: 3s          # was 60s — must stay well under the 5s TWDT window

script:
  - id: ddns_update
    mode: single       # never let two requests overlap
    then:
      - http_request.get:
          url: !lambda |-
            return "http://freemyip.com/update?token=${token}&domain=${name}.freemyip.com";
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("DynDNS", "status=%d", response->status_code);

time:
  - platform: sntp
    id: my_time
    update_interval: 6h
    servers:
      - pool.ntp.org
      - time.cloudflare.com
    on_time:
      - seconds: 0
        minutes: /30       # was /10 — safety net only
        then:
          - script.execute: ddns_update